<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2b2622">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%23ece6dc%22/%3E%3Crect x=%2210%22 y=%2232%22 width=%2244%22 height=%2214%22 rx=%224%22 fill=%22%238a6a4f%22/%3E%3Crect x=%2214%22 y=%2216%22 width=%2236%22 height=%2218%22 rx=%225%22 fill=%22%23b9ab98%22/%3E%3Crect x=%2210%22 y=%2246%22 width=%224%22 height=%226%22 fill=%22%23222%22/%3E%3Crect x=%2250%22 y=%2246%22 width=%224%22 height=%226%22 fill=%22%23222%22/%3E%3C/svg%3E">
<title>现代公寓 · 卧室 3D</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#1d1a17;font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;color:#2a2622;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none}
#app{position:fixed;inset:0}
#app canvas{display:block;width:100%;height:100%;touch-action:none}
.glass{background:rgba(250,247,242,.72);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);border:1px solid rgba(255,255,255,.55);box-shadow:0 6px 24px rgba(30,22,14,.18)}
body.night .glass{background:rgba(34,30,27,.66);border-color:rgba(255,255,255,.14);color:#f3ebe1}
#top{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 10px) 12px 0;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
#title{pointer-events:auto;padding:9px 14px 9px 12px;border-radius:16px;display:flex;align-items:center;gap:10px}
#title .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(145deg,#8a6a4f,#5b4433);display:flex;align-items:center;justify-content:center}
#title .logo i{display:block;width:18px;height:10px;border-radius:3px;background:#efe7db;box-shadow:0 -6px 0 -2px #c9b9a3}
#title h1{margin:0;font-size:19px;letter-spacing:3px;font-weight:600;line-height:1.15}
#title p{margin:2px 0 0;font-size:11px;opacity:.65;letter-spacing:1px}
#tools{display:flex;flex-direction:column;gap:8px;pointer-events:auto}
.tbtn{width:48px;height:48px;border-radius:14px;color:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;line-height:1.2;padding:0;font-family:inherit}
.tbtn b{font-size:17px;font-weight:400;line-height:1.1}
body.night .tbtn{color:#f3ebe1}
#bottom{position:fixed;left:0;right:0;bottom:0;padding:0 0 calc(env(safe-area-inset-bottom) + 12px);pointer-events:none}
#chips{display:flex;gap:8px;overflow-x:auto;padding:4px 12px 2px;scrollbar-width:none;pointer-events:auto;touch-action:pan-x;justify-content:center}
#chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:10px 16px;border-radius:22px;font-size:14px;cursor:pointer;white-space:nowrap;letter-spacing:1px;color:inherit;font-family:inherit}
body.night .chip{color:#f3ebe1}
.chip.active{background:#2c2723;color:#f6efe6;border-color:#2c2723}
body.night .chip.active{background:#e9dcc8;color:#2a241f;border-color:#e9dcc8}
#card{pointer-events:auto;margin:0 12px 10px;border-radius:18px;padding:14px 16px 14px;transform:translateY(20px);opacity:0;transition:.28s ease;visibility:hidden;max-height:40vh;overflow-y:auto;touch-action:pan-y;position:relative}
#card.show{transform:none;opacity:1;visibility:visible}
#card h2{margin:0 0 3px;font-size:18px;letter-spacing:1px;font-weight:600;padding-right:34px}
#card .sub{font-size:12px;opacity:.6;margin-bottom:8px;letter-spacing:.5px}
#card .txt{font-size:14px;line-height:1.7;text-align:justify;opacity:.9}
#card .tags{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
#card .tags span{font-size:11px;padding:3px 8px;border-radius:10px;background:rgba(120,100,80,.14)}
body.night #card .tags span{background:rgba(255,240,220,.12)}
#card .x{position:absolute;right:10px;top:9px;width:30px;height:30px;border-radius:15px;border:none;background:rgba(0,0,0,.07);color:inherit;font-size:18px;line-height:30px;cursor:pointer;padding:0}
body.night #card .x{background:rgba(255,255,255,.1)}
#hint{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 80px);transform:translateX(-50%);padding:7px 14px;border-radius:16px;font-size:12px;white-space:nowrap;transition:opacity .8s;pointer-events:none}
#loading{position:fixed;inset:0;background:radial-gradient(circle at 50% 40%,#4a4038,#171411 72%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:50;transition:opacity .7s;color:#efe5d8}
#loading .ring{width:60px;height:60px;border-radius:50%;border:2px solid rgba(239,229,216,.18);border-top-color:#e8d4b4;animation:sp 1s linear infinite}
#loading .t{margin-top:20px;font-size:16px;letter-spacing:5px}
#loading .s{margin-top:8px;font-size:12px;opacity:.6;letter-spacing:1px}
#loading .bar{margin-top:14px;width:160px;height:3px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden}
#loading .bar i{display:block;height:100%;width:0;background:#e8d4b4;transition:width .25s}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app"></div>
<div id="top">
  <div id="title" class="glass"><div class="logo"><i></i></div><div><h1>现代公寓·卧室</h1><p>Modern Bedroom · 3D</p></div></div>
  <div id="tools">
    <button class="tbtn glass" id="btnMode"><b id="icMode">☀︎</b><span id="txMode">白天</span></button>
    <button class="tbtn glass" id="btnQ"><b>◈</b><span id="txQ">画质高</span></button>
  </div>
</div>
<div id="hint" class="glass">单指环视 · 双指缩放 · 点家具看详情</div>
<div id="bottom">

  <div id="chips"></div>
</div>
